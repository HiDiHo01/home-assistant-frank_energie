name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll website and Zensical documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # @v5

      - name: Build existing Jekyll website
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # @v1
        with:
          source: ./
          destination: ./_site

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # @v6
        with:
          python-version: "3.14"

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Build Zensical documentation
        run: zensical build --clean

      - name: Prepare Jekyll output for the runner
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - name: Add documentation to the Jekyll website
        run: |
          mkdir -p _site/docs
          cp -a site/. _site/docs/

      - name: Upload combined GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # @v5
        with:
          path: _site

  deploy:
    name: Deploy combined GitHub Pages site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # @v5
