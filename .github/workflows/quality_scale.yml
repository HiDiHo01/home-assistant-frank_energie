name: Quality Scale Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-scale:
    permissions:
      contents: read
    name: Quality Scale Checks
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # @v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7

        with:
          persist-credentials: false
      - name: Verify required documentation
        run: |
          required_docs=(
            docs/index.md
            docs/configuration.md
            docs/diagnostics.md
            docs/entities.md
            docs/events.md
            docs/examples.md
            docs/faq.md
            docs/troubleshooting.md
            docs/update_frequency.md
            docs/user_features.md
            docs/smart_battery.md
            docs/smart_charging.md
            docs/architecture.md
            docs/developer.md
            docs/release_process.md
          )

          for file in "${required_docs[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required documentation: $file"
              exit 1
            fi
          done

      - name: Verify diagnostics implementation exists
        run: |
          test -f custom_components/frank_energie/diagnostics.py

      - name: Verify translations exist
        run: |
          test -f custom_components/frank_energie/strings.json
          test -d custom_components/frank_energie/translations

      - name: Verify config flow exists
        run: |
          test -f custom_components/frank_energie/config_flow.py

      - name: Verify tests directory exists
        run: |
          test -d tests

      - name: Verify README documentation links
        run: |
          grep -q "docs/index.md" README.md
          grep -q "docs/entities.md" README.md
          grep -q "docs/events.md" README.md

      - name: Verify manifest exists
        run: |
          test -f custom_components/frank_energie/manifest.json

      - name: Verify GitHub workflows exist
        run: |
          test -d .github/workflows

      - name: Validate manifest and localization JSON
        run: |
          python3 - <<'PY'
          """Reject malformed manifest or translation JSON before claiming prerequisites."""
          import json
          from pathlib import Path

          root = Path("custom_components/frank_energie")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if not isinstance(manifest, dict) or manifest.get("domain") != "frank_energie":
              raise SystemExit("Invalid Frank Energie integration manifest domain")
          if manifest.get("config_flow") is not True:
              raise SystemExit("Frank Energie manifest must enable config_flow")

          translation_files = [
              root / "strings.json",
              *sorted((root / "translations").glob("*.json")),
          ]
          if len(translation_files) < 2:
              raise SystemExit("Missing Frank Energie localization JSON files")
          for path in translation_files:
              if not isinstance(json.loads(path.read_text(encoding="utf-8")), dict):
                  raise SystemExit(f"Localization file must contain an object: {path}")
          print(f"Validated manifest and {len(translation_files)} localization JSON files")
          PY

      - name: Summary
        run: |-
          echo "Quality Scale prerequisites passed; this is not Platinum certification"
          echo "Documentation present"
          echo "Diagnostics present"
          echo "Translations present"
          echo "Config flow present"
          echo "Tests present"
