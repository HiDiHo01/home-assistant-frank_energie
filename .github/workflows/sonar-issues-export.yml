name: Export SonarQube Issues

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Optional PR number (empty = all open project findings)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  export:
    name: Download open SonarQube findings as JSON
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # @v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            sonarcloud.io:443
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # @v6
        with:
          python-version: "3.14"

      - name: Export open findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          python .github/scripts/export_sonar_issues.py \
            --pull-request "$PULL_REQUEST" \
            --output "$RUNNER_TEMP/sonar-open-issues.json"

      - name: Upload JSON export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # @v7.0.2
        with:
          name: sonar-open-issues
          path: ${{ runner.temp }}/sonar-open-issues.json
          if-no-files-found: error
          retention-days: 14
