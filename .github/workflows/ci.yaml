name: Flake8 and pytest

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  run:
    permissions:
      contents: read
    name: Run flake8/pytest (Python ${{ matrix.python-version }} / ${{ matrix.library-source }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.14.2 is the minimum Python version pyproject.toml declares
        # support for; 3.14 tracks the latest 3.14.x patch release.
        python-version: ["3.14.2", "3.14"]
        # Run upstream-main compatibility only for PR #349.
        # Other pull requests and main retain the locked dependency matrix.
        library-source: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.number == 349 && '["locked","upstream-main"]' || '["locked"]') }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # @v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            codeload.github.com:443
            install.python-poetry.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7

        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # @v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: poetry.lock

      - name: Set up Node.js for workflow script regression tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # @v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Poetry
        run: |
          python -m pip install --only-binary :all: "poetry==2.5.1"

      - name: Validate lockfile
        run: poetry check --lock

      - name: Install dependencies with Poetry
        id: install
        run: |
          poetry env use python
          poetry sync --with dev --no-root
          poetry run python -m pip check

      - name: Install python-frank-energie main for PR349 compatibility checks
        if: ${{ matrix.library-source == 'upstream-main' }}
        run: |
          git ls-remote https://github.com/HiDiHo01/python-frank-energie.git refs/heads/main
          poetry run python -m pip install --no-deps --force-reinstall "git+https://github.com/HiDiHo01/python-frank-energie.git@main"
          poetry run python -m pip check

      - name: Verify Home Assistant test environment
        id: environment
        run: |
          poetry run python - <<'PY'
          """Verify the supported interpreter and import the real test framework."""
          import sys
          from importlib import import_module
          from importlib.metadata import version

          if sys.version_info[:2] != (3, 14) or sys.version_info < (3, 14, 2):
              raise SystemExit("Home Assistant tests require Python 3.14.2 or a newer 3.14 patch.")

          import_module("homeassistant.core")
          import_module("pytest_homeassistant_custom_component")
          print(f"Python: {sys.version.split()[0]}")
          for package_name in ("homeassistant", "pytest", "pytest-homeassistant-custom-component"):
              print(f"{package_name}: {version(package_name)}")
          PY

      - name: Register flake8 problem matcher
        run: echo "::add-matcher::.github/workflows/flake8-matchers.json"

      - name: Lint with flake8
        run: |
          poetry run flake8 . --jobs=1 --extend-exclude=.venv --count --select=E9,F63,F7,F82 --show-source --statistics

      # The full check is blocking for new violations. Existing C901/E501
      # technical debt is explicitly recorded in .github/flake8-baseline.json;
      # E203 is excluded only to match Ruff-compatible slice formatting.
      - name: Enforce no new Flake8 violations
        run: poetry run python .github/helpers/check_flake8_baseline.py

      - name: Test with pytest
        id: pytest
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: |
          poetry run python -m pytest tests -ra --junitxml=pytest-results.xml

      - name: Upload pytest report
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-${{ matrix.library-source }}-python-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: error
          retention-days: 14
