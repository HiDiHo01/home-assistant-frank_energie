name: Flake8 and pytest

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  run:
    permissions:
      contents: read
    name: Run flake8/pytest (Python ${{ matrix.python-version }}${{ matrix.experimental && ' experimental' || '' }})
    # Only the officially supported Python 3.14 job is mandatory.
    # GitHub reports failures in the Python 3.15 compatibility job without
    # blocking the stable Home Assistant test gate.
    continue-on-error: ${{ matrix.experimental }}
    # Both Python 3.14.10 and 3.15.2 have verified Ubuntu 24.04 x64 builds.
    # Keep the runner pinned to the verified platform for both versions.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14.10"
            experimental: false
          - python-version: "3.15.2"
            experimental: true

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # @v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            install.python-poetry.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7

        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # @v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: poetry.lock

      - name: Set up Node.js for workflow script regression tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # @v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Poetry
        run: |
          python -m pip install --only-binary :all: "poetry==2.5.1"

      - name: Validate lockfile
        run: poetry check --lock

      - name: Diagnose experimental Python wheel availability
        if: ${{ matrix.experimental }}
        run: |
          python - <<'PY'
          """Report locked packages without a wheel for the current runner."""
          import tomllib
          from pathlib import Path

          from packaging.markers import Marker
          from packaging.tags import sys_tags
          from packaging.utils import parse_wheel_filename

          lock = tomllib.loads(Path("poetry.lock").read_text(encoding="utf-8"))
          supported_tags = set(sys_tags())
          missing = []
          for package in lock["package"]:
              markers = package.get("markers")
              if isinstance(markers, str) and not Marker(markers).evaluate():
                  continue
              if isinstance(markers, dict) and not any(
                  Marker(expression).evaluate() for expression in markers.values()
              ):
                  continue
              wheel_names = [
                  item["file"]
                  for item in package.get("files", [])
                  if item["file"].endswith(".whl")
              ]
              if any(
                  not parse_wheel_filename(filename)[3].isdisjoint(supported_tags)
                  for filename in wheel_names
              ):
                  continue
              missing.append(f"{package['name']}=={package['version']}")

          if missing:
              print("Locked packages without a compatible wheel on this runner:")
              for package_name in sorted(missing):
                  print(f"  {package_name}")
              print(
                  "::warning title=Python 3.15 wheel availability::"
                  f"{len(missing)} locked packages lack a compatible wheel; "
                  "a source build would be required."
              )
          else:
              print("All applicable locked packages have compatible wheels.")
          PY

      - name: Install dependencies with Poetry
        id: install
        timeout-minutes: 10
        env:
          # A missing wheel must fail the experimental check promptly rather
          # than spend the runner budget compiling unsupported native modules.
          POETRY_INSTALLER_ONLY_BINARY: ${{ matrix.experimental && ':all:' || ':none:' }}
        run: |
          poetry env use python
          poetry sync --with dev --no-root --no-ansi -v
          poetry run python -m pip check

      - name: Verify Home Assistant test environment
        id: environment
        run: |
          poetry run python - <<'PY'
          """Verify the supported interpreter and import the real test framework."""
          import sys
          from importlib import import_module
          from importlib.metadata import version

          if sys.version_info[:3] not in {(3, 14, 10), (3, 15, 2)}:
              raise SystemExit("Home Assistant CI requires Python 3.14.10 or 3.15.2.")

          import_module("homeassistant.core")
          import_module("pytest_homeassistant")
          print(f"Python: {sys.version.split()[0]}")
          for package_name in ("homeassistant", "pytest", "pytest-homeassistant"):
              print(f"{package_name}: {version(package_name)}")
          if version("homeassistant") != "2026.11.0" or version("pytest-homeassistant") != "2026.11.0":
              raise SystemExit("Home Assistant and pytest-homeassistant must both be 2026.11.0")
          PY

      - name: Register flake8 problem matcher
        run: echo "::add-matcher::.github/workflows/flake8-matchers.json"

      - name: Lint with flake8
        run: |
          poetry run flake8 . --jobs=1 --extend-exclude=.venv --count --select=E9,F63,F7,F82 --show-source --statistics

      # The full check is blocking for new violations. Existing C901/E501
      # technical debt is explicitly recorded in .github/flake8-baseline.json;
      # E203 is excluded only to match Ruff-compatible slice formatting.
      - name: Enforce no new Flake8 violations
        run: poetry run python .github/helpers/check_flake8_baseline.py

      - name: Test with pytest
        id: pytest
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: |
          poetry run python -m pytest tests -ra --junitxml=pytest-results.xml

      - name: Upload pytest report
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: error
          retention-days: 14

      - name: Summarize experimental Python compatibility
        if: ${{ always() && matrix.experimental }}
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          {
            echo "### Python 3.15.2 (experimental; non-blocking)"
            echo "Dependency installation: ${INSTALL_OUTCOME}"
            echo "Home Assistant environment: ${ENVIRONMENT_OUTCOME}"
            echo "Full pytest suite: ${PYTEST_OUTCOME}"
            echo "These results do not establish official Home Assistant support."
          } >> "$GITHUB_STEP_SUMMARY"
