name: Flake8 and pytest

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  run:
    permissions:
      contents: read
    name: Run flake8/pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14.2 is the minimum Python version pyproject.toml declares
        # support for; 3.14 tracks the latest 3.14.x patch release.
        python-version: ["3.14.2", "3.14"]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # @v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            install.python-poetry.org:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7

        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # @v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Poetry
        run: |
          set -o pipefail
          curl -sSL https://install.python-poetry.org | python3 -
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Install dependencies with Poetry
        run: |
          poetry install
          if [ -f requirements.txt ]; then poetry run pip install -r requirements.txt; fi

      - name: Register flake8 problem matcher
        run: echo "::add-matcher::.github/workflows/flake8-matchers.json"

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=120 --statistics
        continue-on-error: true

      - name: Test with pytest
        run: |
          poetry run pytest -v --capture=no
