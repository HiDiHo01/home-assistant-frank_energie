name: Link Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  link-check:
    permissions:
      contents: read
    name: Validate Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # @v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            developers.home-assistant.io:443
            contributors.home-assistant.io:443
            analytics.home-assistant.io:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
            www.home-assistant.io:443
            www.buymeacoffee.com:443
            docs.python.org:443
            peps.python.org:443
            www.paypal.me:443
            www.paypal.com:443
            buymeacoffee.com:443
            hacs.xyz:443
            my.home-assistant.io:443
            chatgpt.com:443
            img.shields.io:443
      # Harden Runner can briefly interrupt GitHub network access. A bounded
      # preflight prevents checkout from failing during the transient window
      # while keeping the exact same link-validation gate.
      - name: Wait for GitHub checkout connectivity
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --location --head \
              --connect-timeout 5 --max-time 12 https://github.com >/dev/null; then
              echo "PASS GitHub connectivity before checkout"
              exit 0
            fi
            sleep 5
          done
          echo "BLOCK: GitHub checkout connectivity unavailable"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7

        with:
          persist-credentials: false
      - name: Run Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # @v2
        with:
          fail: true
          args: >-
            --verbose
            --no-progress
            --accept 200,403,429
            --root-dir .
            --exclude-file .lycheeignore .
            README.md
            docs/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
