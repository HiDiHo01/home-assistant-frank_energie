name: Temporary HA 2026.11.0 regression verification
on:
  push:
    branches:
      - "chore/poetry-lock-python-frank-energie-2026-11-9"
    paths:
      - ".github/workflows/temporary-ha-2026-11-tests.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.2", "3.14"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # @v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # @v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # @v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Poetry and Ruff
        run: |
          python -m pip install --only-binary :all: "poetry==2.5.1" "ruff==0.15.18"
      - name: Validate environment
        run: |
          poetry check --lock
          poetry env use python
          poetry sync --with dev --no-root
          poetry run python -m pip check
          poetry run python -c 'from importlib.metadata import version; assert version("homeassistant") == "2026.11.0"; assert version("pytest-homeassistant") == "2026.11.0"'
      - name: Ruff and Flake8
        run: |
          ruff check custom_components tests
          ruff format --check --diff custom_components tests
          poetry run flake8 . --jobs=1 --extend-exclude=.venv --count --select=E9,F63,F7,F82 --show-source --statistics
          poetry run python .github/helpers/check_flake8_baseline.py
      - name: Full pytest suite
        run: |
          poetry run python -m pytest tests -ra --junitxml=pytest-results.xml
