name: PR349 - Test against python-frank-energie main

on:
  push:
    branches:
      - codex/handle-api-rate-limits
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test-upstream-main:
    name: Python ${{ matrix.python-version }} / library main
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.2", "3.14"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            install.python-poetry.org:443
            nodejs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            *.blob.core.windows.net:443

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Set up Node.js for workflow regression tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked development dependencies
        run: |
          python -m pip install --only-binary :all: "poetry==2.5.1"
          poetry check --lock
          poetry env use python
          poetry sync --with dev --no-root

      - name: Override library with upstream main (development only)
        run: |
          echo "Testing python-frank-energie/main at:"
          git ls-remote https://github.com/HiDiHo01/python-frank-energie.git refs/heads/main
          poetry run python -m pip install --no-deps --force-reinstall "git+https://github.com/HiDiHo01/python-frank-energie.git@main"
          poetry run python -m pip check
          poetry run python - <<'PY'
          """Verify the test-only upstream dependency provides typed rate limits."""
          from importlib.metadata import version
          from python_frank_energie.exceptions import RateLimitException

          assert RateLimitException("Test", retry_after=1).retry_after == 1
          print("python-frank-energie:", version("python-frank-energie"))
          PY

      - name: Run complete Home Assistant test suite against main
        run: |
          poetry run python -m pytest tests -ra --junitxml=pytest-results.xml

      - name: Upload pytest report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr349-upstream-main-python-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 14
