# Temporary branch-scoped workflow: remove after Poetry lock regeneration.
name: Temporary Home Assistant 2026.11.0 lock refresh
on:
  push:
    branches:
      - "chore/poetry-lock-python-frank-energie-2026-11-9"
    paths:
      - ".github/workflows/temporary-ha-2026-11-lock.yml"

permissions:
  contents: write

jobs:
  resolve:
    if: ${{ github.repository == 'HiDiHo01/home-assistant-frank_energie' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # @v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Checkout trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Python 3.14.2
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # @v6
        with:
          python-version: "3.14.2"
      - name: Install pinned Poetry
        run: python -m pip install --only-binary :all: "poetry==2.5.1"
      - name: Resolve test dependencies and validate lockfile
        run: |
          poetry lock
          poetry check --lock
          python - <<'PY'
          """Assert the resolved dev dependencies use matching Home Assistant releases."""
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("poetry.lock").read_text(encoding="utf-8"))
          versions = {package["name"]: package["version"] for package in lock["package"]}
          assert versions["homeassistant"] == "2026.11.0", versions["homeassistant"]
          assert versions["pytest-homeassistant"] == "2026.11.0", versions["pytest-homeassistant"]
          assert versions["python-frank-energie"] == "2026.11.9"
          assert "pytest-homeassistant-custom-component" not in versions
          PY
      - name: Commit regenerated lockfile to feature branch
        run: |
          if git diff --quiet -- poetry.lock; then
            echo "Poetry lockfile was not modified."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git commit -m "test(deps): resolve Home Assistant 2026.11.0 with official pytest plugin"
          git push origin "HEAD:${GITHUB_REF_NAME}"
