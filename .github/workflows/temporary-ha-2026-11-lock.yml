name: Temporary HA lock validation
on:
  push:
    branches:
      - "chore/poetry-lock-python-frank-energie-2026-11-9"
    paths:
      - ".github/workflows/temporary-ha-2026-11-lock.yml"
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # @v6
        with:
          python-version: "3.14.2"
      - name: Install Poetry
        run: python -m pip install --only-binary :all: "poetry==2.5.1"
      - name: Resolve lock
        run: |
          poetry lock
          poetry check --lock
