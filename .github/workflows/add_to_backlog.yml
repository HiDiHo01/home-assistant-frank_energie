name: Add issues to backlog project

permissions:
  contents: read
  issues: read

on:
  issues:
    types:
      - labeled

jobs:
  add_to_backlog:
    permissions:
      contents: read
    if: github.event.label.name == 'type:backlog'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # @v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
      - name: Add to GitHub Project (v2)
        uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # @v2
        with:
          project-url: https://github.com/users/HiDiHo01/projects/2
          github-token: ${{ secrets.PAT_FOR_FRANK_ENERGIE }}
