name: Add issues to backlog project

permissions:
  contents: read
  issues: read

on:
  issues:
    types:
      - labeled

jobs:
  add_to_backlog:
    permissions:
      contents: read
    if: github.event.label.name == 'type:backlog'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # @v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
      - name: Add to GitHub Project (v2)
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # @v2
        with:
          project-url: https://github.com/users/HiDiHo01/projects/2
          github-token: ${{ secrets.PAT_FOR_FRANK_ENERGIE }}
