name: Dependabot auto-merge
# pull_request_target (not pull_request): GitHub hard-restricts GITHUB_TOKEN to
# read-only for pull_request-triggered runs authored by dependabot[bot],
# regardless of the permissions declared below, which made every "Enable
# auto-merge" call below fail with "Resource not accessible by integration
# (mergePullRequest)". pull_request_target grants the declared write
# permissions instead. Safe here because this workflow never checks out the
# PR's code - it only calls dependabot/fetch-metadata and `gh pr merge`.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    # No job-level override: job-level `permissions:` fully replaces (rather
    # than merges with) the workflow-level block above for this job, and the
    # merge step below needs contents: write - inherit from workflow level
    # instead of keeping a second, easily-out-of-sync copy here.
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # @v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # @v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for Dependabot PRs
        if: ${{steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'}}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
