name: Claude Code Action Official
permissions:
  contents: write
  issues: write
  pull-requests: write
on:
  issue_comment:
    types: [created]

jobs:
  run-claude:
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # @v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            release-assets.githubusercontent.com:443
            ec2-44-240-119-218.us-west-2.compute.amazonaws.com:443
            ec2-54-185-253-63.us-west-2.compute.amazonaws.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
            registry.npmjs.org:443
            api.anthropic.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967
        with:
          trigger_phrase: "@claude"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
