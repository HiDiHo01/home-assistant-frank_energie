# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# To use this workflow, you will need to set up a .github/labeler.yml
# file with configuration.  For more information, see:
# https://github.com/actions/labeler

name: PR and Issue Labeler
on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [edited, closed, opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  # Closing or editing a closed PR must not cancel an active labeling run.
  cancel-in-progress: ${{ github.event.pull_request.state != 'closed' }}

jobs:
  labeler:
    name: Apply labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # @v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
      - name: Label by title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # @v9
        with:
          script: |
            const item = context.payload.issue || context.payload.pull_request;
            const title = item.title.toLowerCase();

            const labels = new Set();

            if (title.includes("deps")) labels.add("dependencies");
            if (title.includes("chore")) labels.add("chore");
            if (title.includes("fix")) labels.add("fixed");
            if (title.includes("feat")) labels.add("feature");
            if (title.includes("enode")) labels.add("enode");
            if (title.includes("graphql")) labels.add("graphql");
            if (title.includes("price")) labels.add("prices");
            if (title.includes("sensor")) labels.add("sensor");
            if (title.includes("number")) labels.add("number");
            if (title.includes("breaking")) labels.add("breaking-change");

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                labels: [...labels],
              });
            }
      - name: Check current PR state before file labels
        id: file_label_state
        if: github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # @v9
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            return pullRequest.state === "open";
      - name: Apply labels
        # Event payloads can be stale; use the state fetched immediately above.
        if: steps.file_label_state.outputs.result == 'true'
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 #v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Check current PR state before size labels
        id: size_label_state
        if: github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # @v9
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            return pullRequest.state === "open";
      - name: Size label
        if: steps.size_label_state.outputs.result == 'true'
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 #v1
        with:
          xs_label: size/xs
          xs_max_size: 10
          s_label: size/s
          s_max_size: 50
          m_label: size/m
          m_max_size: 200
          l_label: size/l
          l_max_size: 500
